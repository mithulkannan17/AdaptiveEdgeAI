version: "3.8"

services:
  auraforest-sentinel:
    build: .
    container_name: auraforest_sentinel
    restart: always
    ports:
      - "8501:8501"  # Streamlit Dashboard
      - "8000:8000"  # FastAPI Backend & OpenAPI Docs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - AURAFOREST_API_URL=http://localhost:8000
